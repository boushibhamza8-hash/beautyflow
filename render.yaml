services:
  - type: web
    name: beautyflow
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn beautyflow.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /login/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
